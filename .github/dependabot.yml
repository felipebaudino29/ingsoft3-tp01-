version: 2
updates:
  - package-ecosystem: "npm"              # dependencias del backend (Node/Express)
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"              # dependencias del frontend (React/Vite)
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"   # las actions del pipeline también son dependencias
    directory: "/"
    schedule:
      interval: "weekly"
