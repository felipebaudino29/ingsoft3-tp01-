name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  URL_API_QA: https://miapp-api-qa-d73h.onrender.com
  URL_FRONT_QA: https://miapp-front-qa-uggf.onrender.com
  URL_API_PROD: https://miapp-api-prod-n1kb.onrender.com
  URL_FRONT_PROD: https://miapp-front-prod-p3bf.onrender.com

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Mostrar rama y commit
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir etapa de tests del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr tests del backend con coverage
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend-coverage:/out" \
            backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            console.log('### Coverage del Backend');
            console.log('| Métrica | Porcentaje |');
            console.log('|---|---|');
            console.log('| Líneas | ' + t.lines.pct + '% |');
            console.log('| Ramas | ' + t.branches.pct + '% |');
            console.log('| Funciones | ' + t.functions.pct + '% |');
            console.log('| Sentencias | ' + t.statements.pct + '% |');
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar artefacto de coverage del backend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      # Los dos pasos que publican van AL FINAL: si los tests fallan, nunca se llega acá.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/felipebaudino29/ingsoft3-tp01--backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Mostrar rama y commit
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir etapa de tests del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr tests del frontend con coverage
        run: |
          docker run --rm \
            -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" \
            frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('Midió 0 archivos: revisar el include'); process.exit(1); }
            const f = (m) => '| ' + m + ' | ' + t[m].pct + '% |';
            console.log('### Coverage del Frontend');
            console.log('| Métrica | Porcentaje |');
            console.log('|---|---|');
            console.log(f('lines'));
            console.log(f('branches'));
            console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar artefacto de coverage del frontend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/felipebaudino29/ingsoft3-tp01--frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    name: Desplegar a QA
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          # -f: si Render contesta 4xx/5xx (imagen inexistente, hook de otro servicio) el job falla.
          IMG_API="ghcr.io/felipebaudino29/ingsoft3-tp01--backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/felipebaudino29/ingsoft3-tp01--frontend:sha-${{ github.sha }}"
          echo "imgURL api:   $IMG_API"
          echo "imgURL front: $IMG_FRONT"
          curl -fsS --max-time 60 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          curl -fsS --max-time 60 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo

      - name: Smoke test QA (api + base + front + front→api)
        shell: bash
        run: |
          echo "Esperando a que QA esté vivo (commit ${{ github.sha }})..."
          # Se da tiempo a que Render cambie de imagen antes de preguntar.
          sleep 60
          for i in $(seq 1 30); do
            if curl -fsS --max-time 15 "$URL_API_QA/health" > /dev/null \
               && curl -fsS --max-time 15 "$URL_API_QA/materias" > /dev/null \
               && curl -fsS --max-time 15 "$URL_FRONT_QA/" > /dev/null \
               && curl -fsS --max-time 15 "$URL_FRONT_QA/api/materias" > /dev/null; then
              echo "✅ QA responde (API + BD + front + proxy)"; exit 0
            fi
            echo "Intento $i: QA todavía no responde bien"
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  integracion:
    name: Integración contra la API de QA
    needs: deploy-qa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Pedidos a la api de QA (sin navegador)
        env:
          API_BASE_URL: ${{ env.URL_API_QA }}
        run: npx playwright test e2e/api.spec.js

      - name: Publicar reporte de integración
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report

  e2e:
    name: E2E contra QA
    needs: integracion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Flujos de navegador contra el front de QA
        env:
          E2E_BASE_URL: ${{ env.URL_FRONT_QA }}
        run: npx playwright test e2e/materias.spec.js

      - name: Publicar reporte e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report

  deploy-prod:
    name: Desplegar a Producción
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Desplegar en Producción la MISMA imagen que verificó QA
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/felipebaudino29/ingsoft3-tp01--backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/felipebaudino29/ingsoft3-tp01--frontend:sha-${{ github.sha }}"
          echo "imgURL api:   $IMG_API"
          echo "imgURL front: $IMG_FRONT"
          curl -fsS --max-time 60 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          curl -fsS --max-time 60 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo

      - name: Smoke test PROD (api + base + front + front→api)
        shell: bash
        run: |
          echo "Esperando a que PROD esté vivo (commit ${{ github.sha }})..."
          sleep 60
          for i in $(seq 1 30); do
            if curl -fsS --max-time 15 "$URL_API_PROD/health" > /dev/null \
               && curl -fsS --max-time 15 "$URL_API_PROD/materias" > /dev/null \
               && curl -fsS --max-time 15 "$URL_FRONT_PROD/" > /dev/null \
               && curl -fsS --max-time 15 "$URL_FRONT_PROD/api/materias" > /dev/null; then
              echo "✅ PROD responde (API + BD + front + proxy)"; exit 0
            fi
            echo "Intento $i: PROD todavía no responde bien"
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
