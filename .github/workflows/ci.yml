name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar rama y commit
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/felipebaudino29/ingsoft3-tp01--backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir etapa de tests del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr tests del backend con coverage
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend-coverage:/out" \
            backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/coverage-summary.json
          node -e "
            const fs = require('fs');
            const file = '$F';
            if (!fs.existsSync(file)) {
              console.log('### Coverage del Backend');
              console.log('No se encontró archivo coverage-summary.json. Revisar ejecución.');
              process.exit(0);
            }
            const t = JSON.parse(fs.readFileSync(file, 'utf8')).total;
            console.log('### Coverage del Backend');
            console.log('| Métrica | Porcentaje |');
            console.log('|---|---|');
            console.log('| Líneas | ' + t.lines.pct + '% |');
            console.log('| Ramas | ' + t.branches.pct + '% |');
            console.log('| Funciones | ' + t.functions.pct + '% |');
            console.log('| Sentencias | ' + t.statements.pct + '% |');
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar artefacto de coverage del backend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar rama y commit
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/felipebaudino29/ingsoft3-tp01--frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Construir etapa de tests del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr tests del frontend con coverage
        run: |
          docker run --rm \
            -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" \
            frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('Midió 0 archivos: revisar el include'); process.exit(1); }
            const f = (m) => '| ' + m + ' | ' + t[m].pct + '% |';
            console.log('### Coverage del Frontend');
            console.log('| Métrica | Porcentaje |');
            console.log('|---|---|');
            console.log(f('lines'));
            console.log(f('branches'));
            console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar artefacto de coverage del frontend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

  deploy-qa:
    name: Desplegar a QA
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -s --connect-timeout 10 --max-time 60 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API" || true
          curl -s --connect-timeout 10 --max-time 60 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT" || true

      - name: Smoke test QA (espera a que QA responda)
        shell: bash
        env:
          URL_API: https://miapp-api-qa-d73h.onrender.com
          URL_FRONT: https://miapp-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_API/api/materias" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  deploy-prod:
    name: Desplegar a Producción
    needs: [deploy-qa]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Desplegar en Producción la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -s --connect-timeout 10 --max-time 60 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API" || true
          curl -s --connect-timeout 10 --max-time 60 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT" || true

      - name: Smoke test PROD (espera a que PROD responda)
        shell: bash
        env:
          URL_API: https://miapp-api-prod.onrender.com
          URL_FRONT: https://miapp-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_API/api/materias" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ PROD responde (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1